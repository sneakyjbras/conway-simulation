name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Pinned toolchain versions ────────────────────────────────────────────────
# The build/lint results depend on the exact compiler and clang-tools versions,
# so we pin them explicitly instead of relying on whatever the runner ships:
#   * LLVM_VERSION   — clang / clang++ / clang-format / clang-tidy (from apt.llvm.org)
#   * GCC_VERSION    — g++ (from Ubuntu's toolchain packages)
# Both provide a complete C++23 <expected> implementation. clang uses the
# libstdc++ headers shipped with g++-${GCC_VERSION}; clang-21 defines
# __cpp_concepts=202002L, which libstdc++'s <expected> requires (older distro
# clangs defined 201907L, which is why the header vanished as "no template
# named 'expected'").
env:
  LLVM_VERSION: "21"
  GCC_VERSION: "14"

jobs:
  build-test:
    name: build+test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: |
          sudo apt-get update
          # libstdc++ (via g++-${GCC_VERSION}) is required by both compilers:
          # gcc uses it directly, clang uses its headers for <expected> etc.
          sudo apt-get install -y "g++-${GCC_VERSION}"
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            wget -qO llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh "${LLVM_VERSION}"
          fi

      - name: Select compiler
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc-${GCC_VERSION}"   >> "$GITHUB_ENV"
            echo "CXX=g++-${GCC_VERSION}"   >> "$GITHUB_ENV"
          else
            echo "CC=clang-${LLVM_VERSION}"  >> "$GITHUB_ENV"
            echo "CXX=clang++-${LLVM_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Report compiler version
        run: |
          echo "CC=$CC CXX=$CXX"
          "$CXX" --version

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ matrix.compiler }}-llvm${{ env.LLVM_VERSION }}-gcc${{ env.GCC_VERSION }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Build (Release)
        run: ./build.sh --type Release

      - name: Run ctest (life3d_tests) - informational only
        id: ctest
        continue-on-error: true
        run: |
          if [[ -d build ]]; then
            ctest --test-dir build --output-on-failure
          else
            echo "build/ directory not found; skipping ctest."
            exit 1
          fi

      - name: Note ctest outcome
        if: steps.ctest.outcome == 'failure'
        run: |
          echo "::warning::ctest reported no tests or a failure (expected until issue #19 adds the life3d_tests target). This does not fail the pipeline; ./test.sh remains the hard gate."

      - name: Run correctness tests (./test.sh)
        run: ./test.sh

  lint:
    name: lint (clang-format + clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned clang tools and libstdc++
        run: |
          sudo apt-get update
          sudo apt-get install -y "g++-${GCC_VERSION}"
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y \
            "clang-format-${LLVM_VERSION}" \
            "clang-tidy-${LLVM_VERSION}"
          clang-format-${LLVM_VERSION} --version
          clang-tidy-${LLVM_VERSION} --version

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER="g++-${GCC_VERSION}"

      - name: clang-format check
        env:
          CLANG_FORMAT: clang-format-${{ env.LLVM_VERSION }}
        run: ./scripts/run-clang-format.sh --check

      - name: clang-tidy check
        env:
          CLANG_TIDY: clang-tidy-${{ env.LLVM_VERSION }}
        run: ./scripts/run-clang-tidy.sh

  timings:
    name: timings (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y "g++-${GCC_VERSION}"
          echo "CC=gcc-${GCC_VERSION}" >> "$GITHUB_ENV"
          echo "CXX=g++-${GCC_VERSION}" >> "$GITHUB_ENV"

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-gcc-llvm${{ env.LLVM_VERSION }}-gcc${{ env.GCC_VERSION }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            build-${{ runner.os }}-gcc-

      - name: Build (Release)
        run: ./build.sh --type Release

      - name: Run benchmarks and record timings
        run: |
          {
            echo "## Latest timings (life3d, $(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo ""
            echo "Runner: $(nproc) cores, $(uname -m)"
            echo ""
            echo '```'
            ./test.sh --bench
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
